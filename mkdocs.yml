site_name: CKA 실습 가이드
site_description: 스킬잇 CKA 온라인 강의 — 강의가 끝나고 따라 하며 개념을 채우는 실습 가이드
site_url: "https://skilleat-labs.github.io/cka-labs-2026/"
repo_url: "https://github.com/skilleat-labs/cka-labs-2026"
repo_name: skilleat-labs/cka-labs-2026

theme:
  name: material
  language: ko
  font:
    text: Pretendard
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: 다크 모드로 전환
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: 라이트 모드로 전환
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - toc.follow

nav:
  - 홈: index.md
  - 시작하기: start.md
  - 강의별 실습:
      - "3강 · 내 클러스터 만들기 (VirtualBox)": labs/04-cluster-build.md
      - "3·19강 · 노드 조인 · CNI · CRI": labs/13-cluster-setup.md
      - "4·6·10강 · 워크로드 (Deployment · ConfigMap · Job · DaemonSet · 사이드카)": labs/06-workloads.md
      - "5강 · 서비스와 내부 통신": labs/09-networking.md
      - "7·11·12강 · 자원 · 스케줄링 · HPA": labs/07-scheduling.md
      - "8강 · Ingress → Gateway API": labs/11-ingress.md
      - "13강 · 스토리지": labs/08-storage.md
      - "14강 · NetworkPolicy": labs/10-networkpolicy.md
      - "15강 · RBAC": labs/14-rbac.md
      - "16·17강 · Helm · Kustomize · CRD": labs/17-helm.md
      - "18강 · 아키텍처 (컨트롤플레인)": labs/03-architecture.md
      - "19강 · 노드 운영 (static pod · kubelet · drain · etcdctl)": labs/16-node-ops.md
      - "20·21강 · 유지보수 (drain · 업그레이드 · 인증서 · etcd)": labs/15-maintenance.md
      - "22·23강 · 트러블슈팅": labs/19-troubleshooting.md

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
